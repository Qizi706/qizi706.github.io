<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">监听 socket 和连接两端</title>
<desc id="desc">客户端通过 connect 向服务端监听 fd 3 发起握手；服务端监听 fd 3 通过 accept 返回通信 fd 4。客户端 fd 7 与服务端 fd 4 之间双向传输业务字节。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs>
<rect width="720" height="420" rx="12" fill="#fafaf9"/>
<g font-family="system-ui, sans-serif" fill="#1e293b" text-anchor="middle">
<rect x="24" y="24" width="270" height="366" rx="10" fill="#fff" stroke="#cbd5e1"/>
<rect x="426" y="24" width="270" height="366" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="159" y="62" font-size="24" font-weight="700">客户端进程</text>
<text x="561" y="62" font-size="24" font-weight="700">服务端进程</text>
<rect x="452" y="86" width="218" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="561" y="115" font-size="20">监听 socket · fd 3</text>
<text x="561" y="141" font-size="16">等待新的连接</text>
<path d="M561 164 V231" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="604" y="202" font-size="18">accept</text>
<text x="159" y="151" font-size="19">socket → connect</text>
<text x="159" y="186" font-size="17">连接服务端口 9090</text>
<path d="M252 144 L444 118" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
<text x="356" y="112" font-size="16">connect · 握手</text>
<rect x="48" y="244" width="222" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<rect x="450" y="244" width="222" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="159" y="276" font-size="20">通信 socket · fd 7</text>
<text x="561" y="276" font-size="20">通信 socket · fd 4</text>
<text x="159" y="306" font-size="17">127.0.0.1:53000</text>
<text x="561" y="306" font-size="17">127.0.0.1:9090</text>
<path d="M280 286 H440" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="360" y="264" font-size="19">业务字节</text>
<text x="159" y="363" font-size="18">send / recv</text>
<text x="561" y="363" font-size="18">recv / send</text>
</g></svg>
