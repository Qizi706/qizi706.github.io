<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
	<title id="title">P、NP、NP-hard 与 NP-complete 的关系</title>
	<desc id="description">在假设 P 不等于 NP 的常见示意下，P 位于 NP 内部，NP-complete 是 NP 和 NP-hard 的交集，NP-hard 还包含不属于 NP 的问题。</desc>
	<defs>
		<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
			<path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.14" />
		</pattern>
		<clipPath id="np-area">
			<ellipse cx="430" cy="350" rx="340" ry="250" />
		</clipPath>
		<filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
		</filter>
	</defs>

	<rect width="1200" height="720" fill="#f8fafc" />
	<rect width="1200" height="720" fill="url(#grid)" />

	<text x="64" y="62" fill="#64748b" font-family="Fira Mono, monospace" font-size="20" letter-spacing="2">
		COMMON DIAGRAM · ASSUMING P ≠ NP
	</text>

	<g filter="url(#soft-shadow)">
		<ellipse cx="430" cy="350" rx="340" ry="250" fill="#3b82f6" fill-opacity="0.14" />
		<ellipse cx="780" cy="350" rx="340" ry="250" fill="#f59e0b" fill-opacity="0.14" />
		<ellipse cx="780" cy="350" rx="340" ry="250" fill="#8b5cf6" fill-opacity="0.24" clip-path="url(#np-area)" />
		<ellipse cx="430" cy="350" rx="340" ry="250" fill="none" stroke="#2563eb" stroke-width="4" />
		<ellipse cx="780" cy="350" rx="340" ry="250" fill="none" stroke="#d97706" stroke-width="4" />
		<circle cx="280" cy="380" r="98" fill="#14b8a6" fill-opacity="0.2" stroke="#0f766e" stroke-width="4" />
	</g>

	<g fill="#0f172a" font-family="sans-serif">
		<text x="235" y="176" font-size="42" font-weight="700">NP</text>
		<text x="875" y="176" font-size="42" font-weight="700">NP-hard</text>
		<text x="280" y="392" font-size="38" font-weight="700" text-anchor="middle">P</text>
		<text x="608" y="332" font-size="32" font-weight="700" text-anchor="middle">NP-complete</text>
		<text x="608" y="370" fill="#475569" font-family="Fira Mono, monospace" font-size="19" text-anchor="middle">NP ∩ NP-hard</text>
		<text x="915" y="410" fill="#92400e" font-size="22" text-anchor="middle">不一定属于 NP</text>
	</g>

	<g font-family="Fira Mono, monospace" font-size="19">
		<rect x="112" y="646" width="16" height="16" fill="#14b8a6" />
		<text x="142" y="661" fill="#334155">P ⊆ NP</text>
		<rect x="360" y="646" width="16" height="16" fill="#8b5cf6" />
		<text x="390" y="661" fill="#334155">NP-complete = NP ∩ NP-hard</text>
		<rect x="802" y="646" width="16" height="16" fill="#f59e0b" />
		<text x="832" y="661" fill="#334155">NP-hard extends beyond NP</text>
	</g>
</svg>
