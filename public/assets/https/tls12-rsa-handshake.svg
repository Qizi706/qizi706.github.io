<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">TLS 1.2 RSA 握手过程</title>
  <desc id="desc">客户端与服务端依次完成参数协商、证书验证、预主密钥交换、会话密钥派生和加密切换。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .participant { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
      .phase { font: 700 19px system-ui, sans-serif; fill: #1e3a8a; }
      .message { font: 600 18px system-ui, sans-serif; fill: #0f172a; }
      .detail { font: 16px system-ui, sans-serif; fill: #475569; }
      .note { font: 16px system-ui, sans-serif; fill: #334155; }
      .line { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1200" height="1280" rx="18" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="1278" rx="18" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <text x="600" y="50" text-anchor="middle" class="title">TLS 1.2（RSA 模式）握手过程</text>

  <rect x="100" y="78" width="300" height="58" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <rect x="800" y="78" width="300" height="58" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="250" y="114" text-anchor="middle" class="participant">客户端（浏览器）</text>
  <text x="950" y="114" text-anchor="middle" class="participant">服务端（服务器）</text>
  <line x1="250" y1="136" x2="250" y2="1215" class="lifeline" />
  <line x1="950" y1="136" x2="950" y2="1215" class="lifeline" />

  <rect x="42" y="155" width="1116" height="36" rx="8" fill="#eff6ff" />
  <text x="600" y="180" text-anchor="middle" class="phase">① 参数协商（Negotiation）</text>
  <text x="600" y="222" text-anchor="middle" class="message">Client Hello</text>
  <text x="600" y="246" text-anchor="middle" class="detail">TLS 版本 · 密码套件列表 · 客户端随机数 r1</text>
  <line x1="250" y1="260" x2="950" y2="260" class="line" />
  <text x="600" y="300" text-anchor="middle" class="message">Server Hello</text>
  <text x="600" y="324" text-anchor="middle" class="detail">选定的密码套件 · 服务端随机数 r2</text>
  <line x1="950" y1="338" x2="250" y2="338" class="line" />

  <rect x="42" y="365" width="1116" height="36" rx="8" fill="#eff6ff" />
  <text x="600" y="390" text-anchor="middle" class="phase">② 身份认证与公钥分发（Authentication）</text>
  <text x="600" y="438" text-anchor="middle" class="message">Certificate</text>
  <text x="600" y="462" text-anchor="middle" class="detail">服务端 RSA 公钥 · CA 电子签名 · 域名与有效期</text>
  <line x1="950" y1="478" x2="250" y2="478" class="line" />
  <rect x="78" y="505" width="344" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
  <text x="250" y="532" text-anchor="middle" class="note">客户端校验证书</text>
  <text x="250" y="556" text-anchor="middle" class="detail">CA 信任链 · 域名 · 有效期</text>

  <rect x="42" y="610" width="1116" height="36" rx="8" fill="#eff6ff" />
  <text x="600" y="635" text-anchor="middle" class="phase">③ 预主密钥交换（Key Exchange）</text>
  <rect x="78" y="665" width="344" height="60" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
  <text x="250" y="691" text-anchor="middle" class="note">本地生成预主密钥 r3</text>
  <text x="250" y="714" text-anchor="middle" class="detail">不以明文离开客户端</text>
  <text x="600" y="758" text-anchor="middle" class="message">Client Key Exchange</text>
  <text x="600" y="782" text-anchor="middle" class="detail">使用服务端公钥加密后的 r3 密文</text>
  <line x1="250" y1="798" x2="950" y2="798" class="line" />
  <rect x="778" y="665" width="344" height="60" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2" />
  <text x="950" y="691" text-anchor="middle" class="note">使用 RSA 私钥解密</text>
  <text x="950" y="714" text-anchor="middle" class="detail">提取原始预主密钥 r3</text>

  <rect x="42" y="835" width="1116" height="36" rx="8" fill="#eff6ff" />
  <text x="600" y="860" text-anchor="middle" class="phase">④ 会话密钥派生（Key Derivation）</text>
  <rect x="78" y="895" width="344" height="82" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
  <rect x="778" y="895" width="344" height="82" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2" />
  <text x="250" y="925" text-anchor="middle" class="note">基于 r1、r2、r3</text>
  <text x="250" y="951" text-anchor="middle" class="detail">派生主密钥与对称会话密钥</text>
  <text x="950" y="925" text-anchor="middle" class="note">基于 r1、r2、r3</text>
  <text x="950" y="951" text-anchor="middle" class="detail">派生完全相同的会话密钥</text>

  <rect x="42" y="1010" width="1116" height="36" rx="8" fill="#eff6ff" />
  <text x="600" y="1035" text-anchor="middle" class="phase">⑤ 握手验证与加密切换（Finalization）</text>
  <text x="600" y="1081" text-anchor="middle" class="message">Change Cipher Spec · Finished（含 MAC 校验）</text>
  <line x1="250" y1="1098" x2="950" y2="1098" class="line" />
  <text x="600" y="1140" text-anchor="middle" class="message">Change Cipher Spec · Finished（含 MAC 校验）</text>
  <line x1="950" y1="1157" x2="250" y2="1157" class="line" />

  <rect x="160" y="1195" width="880" height="54" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="600" y="1228" text-anchor="middle" class="participant">握手成功：后续 HTTP 数据使用对称会话密钥加密</text>
</svg>
