[project]
name = "kv-cache-batch"
version = "0.1.0"
description = "Reproducible causal-attention, KV-cache, and batching lab"
readme = "README.md"
authors = [{ name = "Qizi706", email = "qzhou0706@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["numpy>=2.5.2"]

[project.scripts]
kv-cache-batch = "kv_cache_batch.benchmark:main"
kv-cache-batch-summary = "kv_cache_batch.summarize_batch_size:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]
