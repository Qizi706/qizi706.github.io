[project]
name = "p2-inference-systems"
version = "0.1.0"
description = "Public starter for multi-head causal attention"
readme = "README.md"
authors = [{ name = "Qizi706", email = "qzhou0706@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["numpy>=2.5.2"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inference_lab"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
