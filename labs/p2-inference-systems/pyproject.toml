[project]
name = "p2-inference-systems"
version = "0.1.0"
description = "Reproducible causal-attention, KV-cache, and batching lab"
readme = "README.md"
authors = [{ name = "Qizi706", email = "qzhou0706@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["numpy>=2.5.2"]

[project.scripts]
p2-inference-systems = "inference_lab.benchmark:main"
p2-inference-systems-summary = "inference_lab.summarize_batch_size_scan:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inference_lab"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]
