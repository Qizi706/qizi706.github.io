name: Deploy to Tencent Cloud COS

on:
  push:
    branches:
      - astro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate COS settings
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "${COS_BUCKET}" || { echo "::error::Missing repository variable COS_BUCKET"; exit 1; }
          test -n "${COS_REGION}" || { echo "::error::Missing repository variable COS_REGION"; exit 1; }
          test -n "${TENCENT_CLOUD_SECRET_ID}" || { echo "::error::Missing repository secret TENCENT_CLOUD_SECRET_ID"; exit 1; }
          test -n "${TENCENT_CLOUD_SECRET_KEY}" || { echo "::error::Missing repository secret TENCENT_CLOUD_SECRET_KEY"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install COSCLI
        env:
          COSCLI_VERSION: v1.0.8
          COSCLI_SHA256: 7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
        run: |
          set -euo pipefail
          coscli_path="${RUNNER_TEMP}/coscli"
          curl --fail --silent --show-error --location \
            --output "${coscli_path}" \
            "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64"
          echo "${COSCLI_SHA256}  ${coscli_path}" | sha256sum --check -
          chmod +x "${coscli_path}"
          "${coscli_path}" --version

      - name: Sync site to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_SYNC_DELETE: ${{ vars.COS_SYNC_DELETE }}
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          set -euo pipefail

          delete_args=()
          if [[ "${COS_SYNC_DELETE:-false}" == "true" ]]; then
            delete_args+=(--delete)
          fi

          "${RUNNER_TEMP}/coscli" sync dist/ "cos://${COS_BUCKET}/" \
            --recursive \
            --force \
            "${delete_args[@]}" \
            --endpoint "cos.${COS_REGION}.myqcloud.com" \
            --secret-id "${TENCENT_CLOUD_SECRET_ID}" \
            --secret-key "${TENCENT_CLOUD_SECRET_KEY}" \
            --init-skip \
            --disable-log \
            --process-log=false
