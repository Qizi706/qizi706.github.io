name: Deploy to EdgeOne Makers

on:
  push:
    branches:
      - astro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edgeone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Prepare EdgeOne deployment bundle
        run: cp edgeone.json dist/edgeone.json

      - name: Validate EdgeOne settings
        env:
          EDGEONE_CHINA_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_CHINA_API_TOKEN}" ]; then
            echo "::error::Missing repository secret EDGEONE_CHINA_API_TOKEN"
            exit 1
          fi

      - name: Diagnose EdgeOne upload credentials
        env:
          EDGEONE_CHINA_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            "https://pages-api.cloud.tencent.com/v1",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${process.env.EDGEONE_CHINA_API_TOKEN}`
              },
              body: JSON.stringify({
                Action: "DescribePagesCosTempToken",
                ProjectId: "makers-cxzol5de7rji"
              }),
              signal: AbortSignal.timeout(30000)
            }
          );

          const text = await response.text();
          let body;
          try {
            body = JSON.parse(text);
          } catch {
            console.log(JSON.stringify({
              httpStatus: response.status,
              contentType: response.headers.get("content-type"),
              error: "API returned a non-JSON response"
            }, null, 2));
            process.exit(1);
          }

          const result = body?.Data?.Response;
          console.log(JSON.stringify({
            httpStatus: response.status,
            code: body?.Code,
            message: body?.Message,
            error: result?.Error,
            requestId: result?.RequestId ?? body?.RequestId,
            responseFields: Object.keys(result ?? {}),
            hasBucket: Boolean(result?.Bucket),
            hasRegion: Boolean(result?.Region),
            hasTargetPath: Boolean(result?.TargetPath)
          }, null, 2));
          NODE

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_CHINA_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
        run: |
          npm exec --yes edgeone@1.7.0 -- makers deploy dist \
            --name qizi706-blog \
            --env production \
            --area global \
            --token "${EDGEONE_CHINA_API_TOKEN}" \
            --json
