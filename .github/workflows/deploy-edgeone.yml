name: Deploy to EdgeOne Makers

on:
  push:
    branches:
      - astro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edgeone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Prepare EdgeOne deployment bundle
        run: cp edgeone.json dist/edgeone.json

      - name: Validate EdgeOne settings
        env:
          EDGEONE_CHINA_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EDGEONE_CHINA_API_TOKEN}" || {
            echo "::error::Missing repository secret EDGEONE_CHINA_API_TOKEN"
            exit 1
          }

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_CHINA_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
        run: |
          npm exec --yes edgeone@1.6.28 -- makers deploy dist \
            --name qizi706-blog \
            --env production \
            --area global \
            --token "${EDGEONE_CHINA_API_TOKEN}" \
            --json
